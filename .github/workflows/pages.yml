name: Deploy public DCIM demo
on:
  push:
    branches: [demo]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dcim-local/package-lock.json
      - run: npm ci
        working-directory: dcim-local
      - run: npm test
        working-directory: dcim-local
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build:pages
        working-directory: dcim-local
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dcim-local/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
